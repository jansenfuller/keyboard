name: Build QMK
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        keyboard: [silakka54, cheapino]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Copy ${{ matrix.keyboard }}
        run: |
          cp -r keymap/qmk/keyboards/${{ matrix.keyboard }} keyboards/

      - name: Build ${{ matrix.keyboard }}
        run: |
          make ${{ matrix.keyboard }}:default:uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: qmk-${{ matrix.keyboard }}-firmware
          path: .build/*.uf2
