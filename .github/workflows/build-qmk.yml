name: Build QMK
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    env:
      QMK_HOME: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        keyboard: [silakka54, cheapino]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Copy ${{ matrix.keyboard }}
        run: |
          cp -r keymap/qmk/keyboards/${{ matrix.keyboard }} keyboards/

      - name: Build ${{ matrix.keyboard }}
        run: |
          qmk config user.qmk_home=${{ github.workspace }}
          qmk compile -kb ${{ matrix.keyboard }} -km default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: qmk-${{ matrix.keyboard }}-firmware
          path: |
            *.hex
            *.bin
            *.uf2
