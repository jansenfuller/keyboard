name: Build QMK
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keyboard: [silakka54, cheapino]
    steps:
      - uses: actions/checkout@v4
        with:
          path: keymap

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install QMK CLI
        run: pip3 install qmk

      - name: Setup QMK firmware
        run: qmk setup -y -H /tmp/qmk_fw

      - name: Copy keyboard (${{ matrix.keyboard }})
        run: |
          cp -r keymap/qmk/keyboards/${{ matrix.keyboard }} /tmp/qmk_fw/keyboards/
          ls -la /tmp/qmk_fw/keyboards/${{ matrix.keyboard }}/

      - name: Compile (${{ matrix.keyboard }})
        run: |
          cd /tmp/qmk_fw
          make ${{ matrix.keyboard }}:default

      - name: Locate firmware
        run: |
          mkdir -p /tmp/firmware
          find /tmp/qmk_fw -name "*.uf2" -o -name "*.bin" -o -name "*.hex" \
            -exec cp {} /tmp/firmware/ \; 2>/dev/null || true
          ls -la /tmp/firmware/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmk-${{ matrix.keyboard }}-firmware
          path: /tmp/firmware/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/qmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/firmware/*
          generate_release_notes: true
