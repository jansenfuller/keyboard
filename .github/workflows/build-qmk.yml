name: Build QMK (Silakka54)
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    name: QMK (Silakka54)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QMK CLI
        run: pip3 install qmk

      - name: Clone QMK firmware
        run: git clone --depth 1 https://github.com/qmk/qmk_firmware.git /tmp/qmk_firmware

      - name: Copy keymap
        run: |
          cp -r qmk/keyboards/silakka54/keymaps /tmp/qmk_firmware/keyboards/silakka54/

      - name: Compile
        env:
          QMK_HOME: /tmp/qmk_firmware
        run: qmk compile -kb silakka54 -km default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: qmk-silakka54-firmware
          path: /tmp/qmk_firmware/.build/*.uf2
