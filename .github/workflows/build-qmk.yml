name: Build QMK Firmware
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: cheapino
            repo: vial-kb/vial-qmk
            ref: vial
          - keyboard: silakka54
            repo: vial-kb/vial-qmk
            ref: vial
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_fw
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install qmk

      - name: Overlay keyboard & keymap (Cheapino only)
        if: matrix.keyboard == 'cheapino'
        run: |
          mkdir -p qmk_fw/keyboards/cheapino/keymaps/custom
          cp keymap/qmk/keyboards/cheapino/keyboard.json qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/config.h     qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/matrix.c     qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/cheapino.c   qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/rules.mk     qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/encoder.c    qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/encoder.h    qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/halconf.h    qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/mcuconf.h    qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/ghosting.c   qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/ghosting.h   qmk_fw/keyboards/cheapino/
          cp keymap/qmk/keyboards/cheapino/keymaps/custom/* qmk_fw/keyboards/cheapino/keymaps/custom/

      - name: Overlay keymap (Silakka54 only)
        if: matrix.keyboard == 'silakka54'
        run: |
          mkdir -p qmk_fw/keyboards/silakka54/keymaps/custom
          cp keymap/qmk/keyboards/silakka54/keymaps/custom/* qmk_fw/keyboards/silakka54/keymaps/custom/

      - name: Build ${{ matrix.keyboard }}
        working-directory: qmk_fw
        run: make ${{ matrix.keyboard }}:custom

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.keyboard }}-firmware
          path: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2
