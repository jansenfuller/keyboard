name: Build QMK (Silakka54)
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qmkfm/qmk_firmware:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Copy keymap and compile
        run: |
          cp -r keymap/qmk/keyboards/silakka54/keymaps /qmk_firmware/keyboards/silakka54/
          cd /qmk_firmware
          make silakka54:default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: qmk-silakka54-firmware
          path: /qmk_firmware/.build/*.uf2
