name: Build Vial Firmware
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'vial-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keyboard: [silakka54, cheapino]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          path: vial-qmk
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install qmk

      - name: Copy ${{ matrix.keyboard }}
        run: cp -r keymap/qmk/keyboards/${{ matrix.keyboard }} vial-qmk/keyboards/

      - name: Build ${{ matrix.keyboard }}
        working-directory: vial-qmk
        run: make ${{ matrix.keyboard }}:vial

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.keyboard }}-vial-firmware
          path: |
            vial-qmk/*.hex
            vial-qmk/*.bin
            vial-qmk/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/vial-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vial-qmk/*.hex
            vial-qmk/*.bin
            vial-qmk/*.uf2
          generate_release_notes: true
