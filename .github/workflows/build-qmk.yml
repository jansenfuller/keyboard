name: Build Vial Firmware
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'vial-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: cheapino
            repo: tompi/qmk_firmware
            ref: cheapinov2
          - keyboard: silakka54
            repo: vial-kb/vial-qmk
            ref: vial
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_fw
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install qmk

      - name: Copy keymap
        run: |
          cp -r keymap/qmk/keyboards/${{ matrix.keyboard }}/keymaps qmk_fw/keyboards/${{ matrix.keyboard }}/
          # Fix fork's matrix.c incompatibility with its own debounce.h
          sed -i 's/debounce_init(MATRIX_ROWS)/debounce_init()/g' qmk_fw/keyboards/${{ matrix.keyboard }}/matrix.c 2>/dev/null || true

      - name: Build ${{ matrix.keyboard }}
        working-directory: qmk_fw
        run: make ${{ matrix.keyboard }}:vial

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.keyboard }}-vial-firmware
          path: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/vial-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2
          generate_release_notes: true
