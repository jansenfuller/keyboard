name: Build QMK
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    env:
      QMK_FIRMWARE: ${{ github.workspace }}/qmk_firmware
    strategy:
      fail-fast: false
      matrix:
        keyboard: [silakka54, cheapino]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK deps
        run: |
          pip install -r qmk_firmware/requirements.txt 2>/dev/null || true

      - name: Configure QMK
        run: |
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      - name: Copy ${{ matrix.keyboard }}
        run: |
          ls qmk/keyboards/${{ matrix.keyboard }}/ 2>/dev/null | head -5
          cp -rv qmk/keyboards/${{ matrix.keyboard }} qmk_firmware/keyboards/
          echo "--- After copy ---"
          ls qmk_firmware/keyboards/${{ matrix.keyboard }}/ 2>/dev/null | head -10

      - name: Build ${{ matrix.keyboard }}
        working-directory: qmk_firmware
        run: |
          echo "=== PWD: $PWD ==="
          echo "=== Keyboard exists? ==="
          test -d keyboards/${{ matrix.keyboard }} && echo "YES" || echo "NO"
          ls keyboards/${{ matrix.keyboard }}/ 2>/dev/null | head -5
          make ${{ matrix.keyboard }}:default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: qmk-${{ matrix.keyboard }}-firmware
          path: |
            *.hex
            *.bin
            *.uf2
