name: Build QMK Firmware
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: cheapino
            repo: tompi/qmk_firmware
            ref: cheapinov2
          - keyboard: silakka54
            repo: qmk/qmk_firmware
            ref: master
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_fw
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install qmk

      - name: Debug v2 matrix
        if: matrix.keyboard == 'cheapino'
        run: |
          echo "=== v2 keyboard.json ==="
          cat qmk_fw/keyboards/cheapino/info.json 2>/dev/null || cat qmk_fw/keyboards/cheapino/keyboard.json 2>/dev/null || echo "No keyboard def found"
          echo "=== v2 matrix.c ==="
          head -5 qmk_fw/keyboards/cheapino/matrix.c 2>/dev/null || echo "No matrix.c"
          echo "=== v2 stock keymap ==="
          cat qmk_fw/keyboards/cheapino/keymaps/default/keymap.c 2>/dev/null || cat qmk_fw/keyboards/cheapino/keymaps/vial/keymap.c 2>/dev/null || echo "No keymap found"

      - name: Patch cheapino
        if: matrix.keyboard == 'cheapino'
        run: |
          sed -i 's/debounce_init(MATRIX_ROWS)/debounce_init()/g' qmk_fw/keyboards/cheapino/matrix.c 2>/dev/null || true

      - name: Overlay keymap (Silakka54 only)
        if: matrix.keyboard == 'silakka54'
        run: |
          cp keymap/qmk/keyboards/silakka54/keymaps/default/keymap.c qmk_fw/keyboards/silakka54/keymaps/default/

      - name: Build ${{ matrix.keyboard }}
        working-directory: qmk_fw
        run: make ${{ matrix.keyboard }}:default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.keyboard }}-firmware
          path: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/qmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2
          generate_release_notes: true
