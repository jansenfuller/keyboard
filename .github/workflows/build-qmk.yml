name: Build QMK (Silakka54)
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: qmkfm/qmk_firmware:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Copy keyboard and compile
        env:
          QMK_FIRMWARE: /qmk_firmware
        run: |
          cp -r keymap/qmk/keyboards/silakka54 /qmk_firmware/keyboards/
          echo "=== Verifying keyboard files ==="
          ls -la /qmk_firmware/keyboards/silakka54/
          ls -la /qmk_firmware/keyboards/silakka54/keymaps/default/
          echo "=== Compiling ==="
          cd /qmk_firmware
          make silakka54:default
          echo "=== Converting to UF2 ==="
          pip3 install uf2utils 2>/dev/null || true
          for hex_file in .build/silakka54_default*.hex; do
            if [ -f "$hex_file" ]; then
              uf2conv -t silakka54 -f 0xe48bff56 "$hex_file" -o "${hex_file%.hex}.uf2" || true
            fi
          done
          echo "=== Build output ==="
          ls -la .build/

      - name: Locate firmware
        id: locate
        env:
          QMK_FIRMWARE: /qmk_firmware
        run: |
          cd /qmk_firmware
          mkdir -p /tmp/firmware
          echo "=== QMK_HOME=$QMK_HOME ==="
          echo "=== Contents of QMK_HOME ==="
          ls -la /qmk_firmware/
          echo "=== Looking for .build ==="
          ls -la /qmk_firmware/.build/ 2>/dev/null || echo "No .build/ at /qmk_firmware/"
          echo "=== Searching for firmware files ==="
          find /qmk_firmware -name "*.uf2" -o -name "*.bin" -o -name "*.hex" 2>/dev/null || echo "None found"
          echo "=== Copying any found firmware ==="
          find /qmk_firmware -name "*.uf2" -o -name "*.bin" -o -name "*.hex" -exec cp {} /tmp/firmware/ \; 2>/dev/null || true
          ls -la /tmp/firmware/ || echo "Empty"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmk-silakka54-firmware
          path: /tmp/firmware/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/qmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/firmware/*
          generate_release_notes: true
