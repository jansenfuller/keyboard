name: Build QMK Firmware
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: cheapino
            repo: tompi/qmk_firmware
            ref: cheapinov2
          - keyboard: silakka54
            repo: qmk/qmk_firmware
            ref: master
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_fw
          submodules: false

      - name: Cache QMK submodules (chibios / chibios-contrib / pico-sdk / printf / lufa)
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            qmk_fw/lib
            qmk_fw/.git/modules
          key: qmk-lib-${{ matrix.keyboard }}-${{ matrix.ref }}-${{ github.run_id }}
          restore-keys: |
            qmk-lib-${{ matrix.keyboard }}-${{ matrix.ref }}-

      - name: Fetch required submodules only
        working-directory: qmk_fw
        run: |
          git submodule update --init --depth 1 \
            lib/chibios lib/chibios-contrib lib/pico-sdk lib/printf lib/lufa

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install qmk

      - name: Copy keymap
        run: |
          mkdir -p qmk_fw/keyboards/${{ matrix.keyboard }}/keymaps/custom
          cp keymap/qmk/keyboards/${{ matrix.keyboard }}/keymaps/custom/keymap.c qmk_fw/keyboards/${{ matrix.keyboard }}/keymaps/custom/
          cp keymap/qmk/keyboards/${{ matrix.keyboard }}/keymaps/custom/rules.mk qmk_fw/keyboards/${{ matrix.keyboard }}/keymaps/custom/ 2>/dev/null || true
          # Fix fork's debounce incompatibility
          sed -i 's/debounce_init(MATRIX_ROWS)/debounce_init()/g' qmk_fw/keyboards/${{ matrix.keyboard }}/matrix.c 2>/dev/null || true

      - name: Build ${{ matrix.keyboard }}
        working-directory: qmk_fw
        run: make ${{ matrix.keyboard }}:custom

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.keyboard }}-firmware
          path: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2
