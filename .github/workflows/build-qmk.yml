name: Build QMK Firmware
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
    tags:
      - 'qmk-*'
  pull_request:
    paths:
      - 'qmk/**'
      - '.github/workflows/build-qmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: cheapino
            repo: tompi/qmk_firmware
            ref: cheapinov2
          - keyboard: silakka54
            repo: qmk/qmk_firmware
            ref: master
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: qmk_fw
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Copy keymap
        run: |
          cp keymap/qmk/keyboards/${{ matrix.keyboard }}/keymaps/default/keymap.c qmk_fw/keyboards/${{ matrix.keyboard }}/keymaps/default/
          cp keymap/qmk/keyboards/${{ matrix.keyboard }}/keymaps/default/rules.mk qmk_fw/keyboards/${{ matrix.keyboard }}/keymaps/default/ 2>/dev/null || true

      - name: Build ${{ matrix.keyboard }}
        working-directory: qmk_fw
        run: make ${{ matrix.keyboard }}:default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.keyboard }}-firmware
          path: |
            qmk_fw/*.hex
            qmk_fw/*.bin
            qmk_fw/*.uf2
