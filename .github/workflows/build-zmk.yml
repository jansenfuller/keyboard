name: Build ZMK (Lily58)
on:
  push:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
  pull_request:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [nice_nano_v2]
        shield: [lily58_left, lily58_right]
    steps:
      - uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            zmk/config/zephyr/
            zmk/config/zmk/
            zmk/config/modules/
            zmk/config/tools/
            zmk/config/bootloader/
          key: zmk-${{ hashFiles('zmk/config/west.yml') }}
          restore-keys: |
            zmk-

      - name: Init & update
        working-directory: zmk/config
        run: |
          west init -l .
          west update --fetch-opt=--filter=tree:0

      - name: Build ${{ matrix.shield }}
        working-directory: zmk/config
        run: |
          west zephyr-export
          west build -s zmk/app -b ${{ matrix.board }} -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="${PWD}"

      - name: Upload firmware (${{ matrix.shield }})
        uses: actions/upload-artifact@v4
        with:
          name: zmk-${{ matrix.shield }}
          path: zmk/config/build/zephyr/*.uf2
