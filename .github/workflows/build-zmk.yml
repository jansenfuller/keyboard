name: Build ZMK (Lily58)
on:
  push:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
    tags:
      - 'zmk-*'
  pull_request:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [nice_nano_v2]
        shield: [lily58_left, lily58_right]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.shield }}
        run: |
          set -e
          cd $GITHUB_WORKSPACE/zmk/config

          echo "=== Workspace: $PWD ==="
          west init -l .
          west update --fetch-opt=--filter=tree:0

          echo "=== Verifying ZMK ==="
          ls -la zmk/ 2>/dev/null || echo "ZMK not found!"
          ls -la zmk/app/ 2>/dev/null || echo "zmk/app not found!"

          west zephyr-export
          west build -s zmk/app -b ${{ matrix.board }} -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="$PWD"

          mkdir -p /tmp/firmware
          cp build/zephyr/*.uf2 /tmp/firmware/ 2>/dev/null || true

      - name: Upload firmware (${{ matrix.shield }})
        uses: actions/upload-artifact@v4
        with:
          name: zmk-${{ matrix.shield }}
          path: /tmp/firmware/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/zmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/firmware/*
          generate_release_notes: true
