name: Build ZMK (Lily58)
on:
  push:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
    tags:
      - 'zmk-*'
  pull_request:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [nice_nano_v2]
        shield: [lily58_left, lily58_right]
    steps:
      - uses: actions/checkout@v4

      - name: Init & update
        working-directory: zmk/config
        run: |
          west init -l .
          west update --fetch-opt=--filter=tree:0

      - name: Build ${{ matrix.shield }}
        working-directory: zmk/config
        run: |
          west zephyr-export
          west build -s zmk/app -b ${{ matrix.board }} -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="${PWD}"

      - name: Upload firmware (${{ matrix.shield }})
        uses: actions/upload-artifact@v4
        with:
          name: zmk-${{ matrix.shield }}
          path: zmk/config/build/zephyr/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/zmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: zmk/config/build/zephyr/*.uf2
          generate_release_notes: true
