name: Build ZMK (Lily58)
on:
  push:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
    tags:
      - 'zmk-*'
  pull_request:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [nice_nano_v2]
        shield: [lily58_left, lily58_right]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.shield }}
        run: |
          set -e
          cd $GITHUB_WORKSPACE/zmk/config

          echo "=== Workspace: $PWD ==="
          west init -l .
          echo "=== Cloning ZMK ==="
          git clone --depth 1 --branch v0.3.0 https://github.com/zmkfirmware/zmk.git zmk
          ls zmk/app/ 2>/dev/null || echo "ZMK clone failed!"
          echo "=== West update (remaining) ==="
          west update 2>&1

          west zephyr-export
          west build -s zmk/app -b ${{ matrix.board }} -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="$PWD"

          mkdir -p /tmp/firmware
          uf2=$(find build/zephyr -name "*.uf2" 2>/dev/null | head -1)
          if [ -n "$uf2" ]; then
            cp "$uf2" "/tmp/firmware/${{ matrix.shield }}.uf2"
          fi

      - name: Upload firmware (${{ matrix.shield }})
        uses: actions/upload-artifact@v4
        with:
          name: zmk-artifact-${{ matrix.shield }}
          path: /tmp/firmware/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware
        uses: actions/download-artifact@v4
        with:
          pattern: zmk-artifact-*
          path: /tmp/firmware
          merge-multiple: true

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: /tmp/firmware/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/zmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/firmware/*
          generate_release_notes: true
