name: Build ZMK (Lily58)
on:
  push:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
    tags:
      - 'zmk-*'
  pull_request:
    paths:
      - 'zmk/**'
      - '.github/workflows/build-zmk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [nice_nano_v2]
        shield: [lily58_left, lily58_right]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize
        run: |
          echo "=== ENV ==="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$PWD"
          echo "HOME=$HOME"
          echo "=== DIRS ==="
          ls -la /__w/
          ls -la /__w/keyboard/ 2>/dev/null || echo "No /__w/keyboard/"
          ls -la /__w/keyboard/keyboard/ 2>/dev/null || echo "No /__w/keyboard/keyboard/"
          echo "=== Init ==="
          rm -rf .west
          cp zmk/config/west.yml .
          west init -l .
          west update --fetch-opt=--filter=tree:0

      - name: Build ${{ matrix.shield }}
        run: |
          west zephyr-export
          west build -s zmk/app -b ${{ matrix.board }} -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="${PWD}/zmk/config"

      - name: Upload firmware (${{ matrix.shield }})
        uses: actions/upload-artifact@v4
        with:
          name: zmk-${{ matrix.shield }}
          path: build/zephyr/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/zmk-')
        uses: softprops/action-gh-release@v2
        with:
          files: build/zephyr/*.uf2
          generate_release_notes: true
