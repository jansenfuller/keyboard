name: Build Vial (Cheapino)
on:
  push:
    paths:
      - 'qmk/keyboards/cheapino/**'
      - '.github/workflows/build-vial.yml'
    tags:
      - 'vial-*'
  pull_request:
    paths:
      - 'qmk/keyboards/cheapino/**'
      - '.github/workflows/build-vial.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          path: vial-qmk
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: keymap

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-pip
          pip3 install qmk

      - name: Copy Cheapino
        run: cp -r keymap/qmk/keyboards/cheapino vial-qmk/keyboards/

      - name: Build Vial
        working-directory: vial-qmk
        run: make cheapino:vial

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cheapino-vial-firmware
          path: |
            vial-qmk/*.hex
            vial-qmk/*.bin
            vial-qmk/*.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/vial-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vial-qmk/*.hex
            vial-qmk/*.bin
            vial-qmk/*.uf2
          generate_release_notes: true
